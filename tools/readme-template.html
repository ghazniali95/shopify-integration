<title>Shopify Integration for Laravel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F5F7F6;
  --surface:#FFFFFF;
  --surface-2:#EAEFED;
  --ink:#131A18;
  --ink-2:#33403C;
  --muted:#697C76;
  --rule:#DBE3E0;
  --rule-strong:#C2CECA;
  --accent:#007355;
  --accent-deep:#005741;
  --accent-soft:#E0EFE8;
  --warn:#9C5518;
  --warn-soft:#F5EADF;
  --chip-bg:#E5EDEA;
  --chip-ink:#1D4C3E;
  --code-bg:#101A17;
  --code-rule:#22322D;
  --code-ink:#DCE6E2;
  --syn-comment:#6C807A;
  --syn-key:#7FD3B0;
  --syn-string:#E3B778;
  --syn-num:#93C9E8;
  --syn-fn:#EFF2F1;
  --syn-attr:#A5DBC7;
  --shadow:0 1px 2px rgba(19,26,24,.05), 0 8px 24px -16px rgba(19,26,24,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1412;
    --surface:#141D1A;
    --surface-2:#1A2521;
    --ink:#E7EDEA;
    --ink-2:#BCC9C4;
    --muted:#8B9C96;
    --rule:#243330;
    --rule-strong:#31433E;
    --accent:#4EC9A0;
    --accent-deep:#7BDCBC;
    --accent-soft:#16302A;
    --warn:#D69255;
    --warn-soft:#2C2119;
    --chip-bg:#1B2925;
    --chip-ink:#8FD9BF;
    --code-bg:#080F0D;
    --code-rule:#1B2825;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1412;
  --surface:#141D1A;
  --surface-2:#1A2521;
  --ink:#E7EDEA;
  --ink-2:#BCC9C4;
  --muted:#8B9C96;
  --rule:#243330;
  --rule-strong:#31433E;
  --accent:#4EC9A0;
  --accent-deep:#7BDCBC;
  --accent-soft:#16302A;
  --warn:#D69255;
  --warn-soft:#2C2119;
  --chip-bg:#1B2925;
  --chip-ink:#8FD9BF;
  --code-bg:#080F0D;
  --code-rule:#1B2825;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);color:var(--ink)}

.shell{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  max-width:1180px;
  margin:0 auto;
  padding:0 24px 96px;
}
@media (min-width:1000px){
  .shell{grid-template-columns:232px minmax(0,1fr);gap:56px;padding:0 32px 120px}
}

/* ── rail ─────────────────────────────── */
.rail{padding-top:32px}
@media (min-width:1000px){
  .rail{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding-top:56px;padding-bottom:40px}
}
.rail-label{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;
}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:1px}
@media (max-width:999px){
  .toc{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px 20px;
       border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;margin-bottom:8px}
}
.toc a{
  display:block;
  font-family:"Archivo",system-ui,sans-serif;
  font-size:13.5px;line-height:1.35;
  color:var(--muted);text-decoration:none;
  padding:5px 0 5px 12px;
  border-left:2px solid transparent;
  transition:color .12s ease,border-color .12s ease;
}
.toc a:hover{color:var(--ink)}
.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── main ─────────────────────────────── */
main{min-width:0;padding-top:24px}
@media (min-width:1000px){main{padding-top:56px}}

.masthead{padding-bottom:40px;border-bottom:1px solid var(--rule-strong);margin-bottom:52px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);
  background:var(--accent-soft);
  border-radius:2px;padding:5px 9px;margin-bottom:22px;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
h1{
  font-family:"Archivo",system-ui,sans-serif;
  font-weight:700;font-size:clamp(34px,5.2vw,52px);line-height:1.04;
  letter-spacing:-.026em;margin:0 0 20px;text-wrap:balance;
}
.lede{font-size:20px;line-height:1.55;color:var(--ink-2);margin:0 0 12px;max-width:60ch}
.lede-2{font-size:17.5px;color:var(--muted);margin:0;max-width:66ch}

.factbar{
  display:flex;flex-wrap:wrap;gap:0;margin-top:34px;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface);overflow:hidden;
}
.fact{padding:13px 20px;border-right:1px solid var(--rule);flex:1 1 auto;min-width:132px}
.fact:last-child{border-right:none}
.fact dt{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 5px;
}
.fact dd{
  margin:0;font-family:"Archivo",system-ui,sans-serif;
  font-size:14.5px;font-weight:600;color:var(--ink);
}

section{margin-bottom:64px;scroll-margin-top:24px}
h2{
  font-family:"Archivo",system-ui,sans-serif;
  font-weight:600;font-size:27px;line-height:1.2;letter-spacing:-.017em;
  margin:0 0 8px;padding-top:6px;text-wrap:balance;
}
.h2-rule{height:2px;background:var(--ink);width:26px;border-radius:2px;margin:0 0 22px}
h3{
  font-family:"Archivo",system-ui,sans-serif;
  font-weight:600;font-size:18.5px;letter-spacing:-.008em;
  margin:38px 0 10px;color:var(--ink);text-wrap:balance;
}
h4{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:30px 0 10px;
}
p{margin:0 0 16px;max-width:68ch}
ul,ol{max-width:68ch;padding-left:22px;margin:0 0 18px}
li{margin-bottom:8px}
li::marker{color:var(--muted)}
strong{font-weight:600;color:var(--ink)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

code{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.845em;
  background:var(--chip-bg);color:var(--chip-ink);
  padding:.14em .38em;border-radius:3px;
  word-break:break-word;
}
pre{
  background:var(--code-bg);
  border:1px solid var(--code-rule);
  border-radius:5px;
  padding:18px 20px;
  overflow-x:auto;
  margin:0 0 20px;
  box-shadow:var(--shadow);
}
pre code{
  background:none;color:var(--code-ink);padding:0;border-radius:0;
  font-size:13px;line-height:1.62;display:block;white-space:pre;word-break:normal;
}
.hljs-comment,.hljs-quote{color:var(--syn-comment);font-style:italic}
.hljs-keyword,.hljs-literal,.hljs-type,.hljs-meta .hljs-keyword{color:var(--syn-key)}
.hljs-string,.hljs-meta .hljs-string,.hljs-regexp{color:var(--syn-string)}
.hljs-number,.hljs-symbol{color:var(--syn-num)}
.hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-section{color:var(--syn-fn);font-weight:600}
.hljs-attr,.hljs-attribute,.hljs-property{color:var(--syn-attr)}
.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--code-ink)}
.hljs-built_in{color:var(--syn-attr)}
.hljs-meta{color:var(--syn-comment)}

.diagram{
  background:var(--surface);
  border:1px solid var(--rule);
  border-left:3px solid var(--accent);
  border-radius:4px;
  padding:20px 22px;margin:0 0 22px;overflow-x:auto;
}
.diagram pre{
  background:none;border:none;box-shadow:none;padding:0;margin:0;
}
.diagram pre code{
  color:var(--ink-2);font-size:12.5px;line-height:1.72;
}

.tablewrap{overflow-x:auto;margin:0 0 22px;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:460px}
thead th{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:left;
  padding:11px 16px;border-bottom:1px solid var(--rule-strong);
  background:var(--surface-2);white-space:nowrap;
}
tbody td{
  padding:11px 16px;border-bottom:1px solid var(--rule);
  vertical-align:top;color:var(--ink-2);font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none}
tbody td:first-child{color:var(--ink)}
tbody td code{font-size:12.5px;white-space:nowrap}

/* numbered sequences — used only where order is real */
.seq{list-style:none;counter-reset:step;padding:0;margin:0 0 22px;max-width:70ch}
.seq li{
  counter-increment:step;position:relative;
  padding:0 0 0 44px;margin-bottom:13px;min-height:26px;
}
.seq li::before{
  content:counter(step,decimal-leading-zero);
  position:absolute;left:0;top:2px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--rule);
  border-radius:3px;padding:2px 6px;font-variant-numeric:tabular-nums;
}
.seq li.critical::before{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.seq li.critical{color:var(--ink)}
.tag-critical{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  background:var(--warn-soft);border-radius:2px;padding:1px 5px;margin-left:8px;
  white-space:nowrap;vertical-align:1px;
}

.steps{list-style:none;counter-reset:adopt;padding:0;margin:0 0 22px}
.steps li{
  counter-increment:adopt;position:relative;padding-left:50px;margin-bottom:20px;max-width:68ch;
}
.steps li::before{
  content:counter(adopt);
  position:absolute;left:0;top:-2px;
  width:32px;height:32px;display:grid;place-items:center;
  font-family:"Archivo",system-ui,sans-serif;font-size:14px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
  border-radius:50%;
}
.steps li strong{display:block;font-family:"Archivo",system-ui,sans-serif;font-size:16px;margin-bottom:2px}

.note{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:4px;padding:18px 22px;margin:0 0 24px;max-width:70ch;
}
.note p:last-child{margin-bottom:0}
.note-label{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:0 0 7px;display:block;
}
.note.warn{border-left-color:var(--warn)}
.note.warn .note-label{color:var(--warn)}

.cardgrid{display:grid;gap:14px;margin:0 0 22px}
@media (min-width:680px){.cardgrid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px 20px}
.card h4{margin-top:0}
.card p:last-child{margin-bottom:0}

.kicker{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;
}

footer.pagefoot{
  border-top:1px solid var(--rule-strong);padding-top:26px;margin-top:8px;
  color:var(--muted);font-size:14px;
}
footer.pagefoot p{max-width:70ch}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
html{scroll-behavior:smooth}

blockquote{
  margin:20px 0;padding:12px 18px;
  border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 8px 8px 0;
}
blockquote p{margin:0;color:var(--ink-2)}
</style>

  <aside class="rail">
    <p class="rail-label">Contents</p>
    {{TOC}}
  </aside>
  <main>
    <header class="masthead">
      <span class="eyebrow"><span class="dot"></span> Package documentation &middot; v0.5.0</span>
      <h1>Shopify Integration for Laravel</h1>
      <p class="lede">Multi-tenant Shopify authentication for Laravel apps — embedded and standalone.</p>
      <dl class="factbar">
        <div class="fact"><dt>Composer</dt><dd>shopgpt/shopify-integration</dd></div>
        <div class="fact"><dt>Namespace</dt><dd>ShopGPT\ShopifyIntegration</dd></div>
        <div class="fact"><dt>PHP</dt><dd>8.1 &ndash; 8.4</dd></div>
        <div class="fact"><dt>Laravel</dt><dd>10 &middot; 11 &middot; 12</dd></div>
      </dl>
    </header>
{{BODY}}
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  if (window.hljs) {
    document.querySelectorAll('pre code[class^="language-"]').forEach(function (b) {
      try { window.hljs.highlightElement(b); } catch (e) {}
    });
  }
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var map = {};
  links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
  var sections = Object.keys(map).map(function (id) { return document.getElementById(id); }).filter(Boolean);
  if (!('IntersectionObserver' in window) || !sections.length) return;
  var visible = new Set();
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id); });
    var cur = sections.filter(function (s) { return visible.has(s.id); })[0];
    links.forEach(function (a) { a.classList.remove('active'); });
    if (cur && map[cur.id]) map[cur.id].classList.add('active');
  }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
  sections.forEach(function (s) { obs.observe(s); });
})();
</script>
